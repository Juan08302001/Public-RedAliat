<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTAN Sistemas | Asistente Virtual</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Inter",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 0% 0%,
            #dbeafe 0,
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            #bfdbfe 0,
            transparent 35%
        ),
        #f1f5f9;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================================
   APP
===================================================== */

.app {

    width: 95%;
    max-width: 570px;
    height: 94vh;

    background: #f8fafc;

    border-radius: 30px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    box-shadow:
        0 30px 80px rgba(15,23,42,.18),
        0 10px 30px rgba(37,99,235,.08);

    border: 1px solid rgba(255,255,255,.8);
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: relative;

    padding: 18px 20px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #172554 45%,
            #2563eb
        );

    display: flex;
    justify-content: space-between;
    align-items: center;
}


.header-main {

    display: flex;
    align-items: center;
    gap: 13px;
}


.logo {

    width: 52px;
    height: 52px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid rgba(255,255,255,.15);

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 27px;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.15),
        0 8px 20px rgba(0,0,0,.12);
}


.header-title {

    font-size: 1.08rem;
    font-weight: 750;

    letter-spacing: -.2px;
}


.header-subtitle {

    margin-top: 4px;

    display: flex;
    align-items: center;

    gap: 6px;

    font-size: .72rem;

    color: #dbeafe;
}


.online {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #4ade80;

    box-shadow:
        0 0 0 3px rgba(74,222,128,.12),
        0 0 9px #4ade80;
}


.version {

    position: absolute;

    top: 8px;
    right: 12px;

    font-size: .6rem;

    color: #bfdbfe;

    opacity: .9;
}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    overflow-y: auto;

    padding: 20px 16px;

    display: flex;
    flex-direction: column;

    gap: 12px;

    background:
        linear-gradient(
            180deg,
            #eff6ff 0%,
            #f8fafc 45%,
            #f8fafc 100%
        );
}


.chat::-webkit-scrollbar {
    width: 5px;
}

.chat::-webkit-scrollbar-thumb {

    background: #bfdbfe;

    border-radius: 20px;
}


/* =====================================================
   MENSAJES
===================================================== */

.message {

    max-width: 90%;

    padding: 14px 15px;

    border-radius: 18px;

    font-size: .9rem;

    line-height: 1.55;

    opacity: 0;

    transform:
        translateY(10px)
        scale(.98);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


.message.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


.bot {

    align-self: flex-start;

    background: white;

    color: #1e293b;

    border:
        1px solid #e2e8f0;

    border-bottom-left-radius: 5px;

    box-shadow:
        0 5px 18px rgba(15,23,42,.055);
}


.user {

    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    color: white;

    border-bottom-right-radius: 5px;

    box-shadow:
        0 7px 20px rgba(37,99,235,.2);
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    padding: 17px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #ffffff
        );

    border:
        1px solid #dbeafe;
}


.welcome-icon {

    width: 42px;
    height: 42px;

    border-radius: 13px;

    background: #dbeafe;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;

    margin-bottom: 10px;
}


.welcome-title {

    color: #172554;

    font-size: 1.03rem;

    font-weight: 750;

    margin-bottom: 5px;
}


.welcome-text {

    color: #64748b;

    font-size: .84rem;

    line-height: 1.55;
}


/* =====================================================
   SECCIÓN
===================================================== */

.section-title {

    color: #475569;

    font-size: .76rem;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .5px;

    margin:
        3px 4px
        1px;
}


/* =====================================================
   OPCIONES
===================================================== */

.options {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.option {

    width: 100%;

    border: 1px solid #e2e8f0;

    background: white;

    border-radius: 16px;

    padding: 11px;

    display: flex;

    align-items: center;

    gap: 11px;

    cursor: pointer;

    text-align: left;

    color: #1e293b;

    font-size: .85rem;

    font-weight: 650;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border .18s ease,
        background .18s ease;
}


.option:hover {

    transform: translateY(-2px);

    border-color: #93c5fd;

    background: #f8fbff;

    box-shadow:
        0 8px 20px rgba(37,99,235,.1);
}


.option:active {

    transform: scale(.985);
}


.option-icon {

    min-width: 39px;
    width: 39px;
    height: 39px;

    border-radius: 12px;

    background: #eff6ff;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;
}


.option-content {

    flex: 1;
}


.option-arrow {

    color: #94a3b8;

    font-size: 17px;
}


/* =====================================================
   BADGES
===================================================== */

.badge {

    display: inline-block;

    padding: 4px 8px;

    border-radius: 7px;

    font-size: .65rem;

    font-weight: 750;

    margin-bottom: 7px;
}


.badge-blue {

    color: #1d4ed8;

    background: #eff6ff;
}


.badge-red {

    color: #b91c1c;

    background: #fef2f2;
}


.badge-green {

    color: #15803d;

    background: #f0fdf4;
}


.badge-orange {

    color: #c2410c;

    background: #fff7ed;
}


/* =====================================================
   PASOS
===================================================== */

.steps {

    margin-top: 10px;
}


.step {

    display: flex;

    gap: 10px;

    padding: 9px 0;

    border-bottom:
        1px solid #f1f5f9;
}


.step:last-child {

    border-bottom: none;
}


.step-number {

    min-width: 25px;
    height: 25px;

    border-radius: 8px;

    background: #dbeafe;

    color: #1d4ed8;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: .72rem;

    font-weight: 800;
}


.step-text {

    font-size: .83rem;

    color: #475569;

    line-height: 1.5;
}


/* =====================================================
   ALERTAS
===================================================== */

.alert {

    padding: 11px 12px;

    border-radius: 12px;

    margin-top: 10px;

    font-size: .8rem;

    line-height: 1.5;
}


.warning {

    background: #fff7ed;

    border: 1px solid #fed7aa;

    color: #9a3412;
}


.danger {

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #991b1b;
}


.success {

    background: #f0fdf4;

    border: 1px solid #bbf7d0;

    color: #166534;
}


.info {

    background: #eff6ff;

    border: 1px solid #bfdbfe;

    color: #1e40af;
}


/* =====================================================
   ENLACES
===================================================== */

a {

    color: #2563eb;

    text-decoration: none;

    font-weight: 750;
}


a:hover {

    text-decoration: underline;
}


/* =====================================================
   TYPING
===================================================== */

.typing {

    align-self: flex-start;

    display: flex;

    align-items: center;

    gap: 5px;

    padding: 11px 14px;

    background: white;

    border: 1px solid #e2e8f0;

    border-radius: 15px;

    box-shadow:
        0 4px 12px rgba(15,23,42,.04);
}


.dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #3b82f6;

    animation: typing 1.2s infinite;
}


.dot:nth-child(2) {
    animation-delay: .2s;
}


.dot:nth-child(3) {
    animation-delay: .4s;
}


@keyframes typing {

    0%,60%,100% {

        opacity: .3;

        transform:
            translateY(0);
    }

    30% {

        opacity: 1;

        transform:
            translateY(-4px);
    }
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    padding: 9px 14px 13px;

    background: white;

    border-top:
        1px solid #e2e8f0;

    display: flex;

    gap: 8px;
}


.footer-btn {

    flex: 1;

    border: none;

    background: #f8fafc;

    color: #64748b;

    padding: 9px;

    border-radius: 11px;

    cursor: pointer;

    font-size: .76rem;

    font-weight: 650;

    transition: .2s;
}


.footer-btn:hover {

    background: #eff6ff;

    color: #1e3a8a;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px) {

    body {

        align-items: stretch;
    }

    .app {

        width: 100%;

        height: 100vh;

        border-radius: 0;
    }

    .chat {

        padding: 17px 12px;
    }

    .message {

        max-width: 94%;

        font-size: .87rem;
    }

    .option {

        padding: 10px;
    }

}

</style>

/* =====================================================
   ELEMENTOS

const chat =
    document.getElementById("chat");


/* =====================================================
   AGREGAR MENSAJE
===================================================== */

function addMessage(
    html,
    sender = "bot"
) {

    const message =
        document.createElement("div");

    message.className =
        `message ${sender}`;

    message.innerHTML =
        html;

    chat.appendChild(message);

    setTimeout(() => {

        message.classList.add("show");

        chat.scrollTop =
            chat.scrollHeight;

    }, 30);

}


/* =====================================================
   ESCRIBIENDO
===================================================== */

function typing(callback) {

    const box =
        document.createElement("div");

    box.className =
        "typing";

    box.innerHTML = `
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    `;

    chat.appendChild(box);

    chat.scrollTop =
        chat.scrollHeight;


    setTimeout(() => {

        box.remove();

        callback();

    }, 500);

}


/* =====================================================
   OPCIONES
===================================================== */

function showOptions(options) {

    const title =
        document.createElement("div");

    title.className =
        "section-title";

    title.textContent =
        "Selecciona una opción";

    chat.appendChild(title);


    const container =
        document.createElement("div");

    container.className =
        "options";


    options.forEach(option => {

        const button =
            document.createElement("button");

        button.className =
            "option";


        button.innerHTML = `

            <span class="option-icon">
                ${option.icon}
            </span>

            <span class="option-content">
                ${option.title}
            </span>

            <span class="option-arrow">
                ›
            </span>

        `;


        button.onclick = () => {

            addMessage(
                option.title,
                "user"
            );


            typing(() => {

                openSection(
                    option.next
                );

            });

        };


        container.appendChild(button);

    });


    chat.appendChild(container);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   ABRIR SECCIÓN
===================================================== */

function openSection(key) {

    const section =
        sections[key];


    if (!section)
        return;


    if (section.answer) {

        addMessage(
            section.answer,
            "bot"
        );


        setTimeout(() => {

            showBackButton();

        }, 250);


        return;
    }


    addMessage(
        section.title,
        "bot"
    );


    showOptions(
        section.options
    );

}


/* =====================================================
   VOLVER
===================================================== */

function showBackButton() {

    const container =
        document.createElement("div");

    container.className =
        "options";


    const button =
        document.createElement("button");

    button.className =
        "option";


    button.innerHTML = `

        <span class="option-icon">
            ↩️
        </span>

        <span class="option-content">
            Ver otros temas de Sistemas
        </span>

        <span class="option-arrow">
            ›
        </span>

    `;


    button.onclick = () => {

        goHome();

    };


    container.appendChild(button);

    chat.appendChild(container);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   INICIO
===================================================== */

function goHome() {

    chat.innerHTML = "";

    typing(() => {

        openSection(
            "inicio"
        );

    });

}


/* =====================================================
   REINICIAR
===================================================== */

function restart() {

    chat.innerHTML = "";

    welcome();

}


/* =====================================================
   BIENVENIDA
===================================================== */

function welcome() {

    addMessage(`

        <div class="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <div class="welcome-title">
                ¡Hola! Soy tu asistente de Sistemas
            </div>

            <div class="welcome-text">

                Te ayudaré a resolver problemas
                frecuentes relacionados con tu correo,
                Brightspace, Mi Red Aliat, Office y
                seguridad.

                <br><br>

                <strong>
                    No necesitas escribir una pregunta.
                </strong>

                Solo selecciona el problema que más
                se parezca al tuyo.

            </div>

        </div>

    `);


    setTimeout(() => {

        openSection(
            "inicio"
        );

    }, 450);

}


/* =====================================================
   INICIAR
===================================================== */

welcome();

</script>
