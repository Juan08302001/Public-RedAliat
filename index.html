<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistente Virtual UTAN Industrias</title>

<style>

/* ================================
   CONFIGURACIÓN GENERAL
================================ */

* {
  box-sizing: border-box;
}

body {
  font-family: "Inter", "Segoe UI", Arial, sans-serif;
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
    radial-gradient(circle at bottom right, #bfdbfe 0%, transparent 35%),
    #eef4fb;

  display: flex;
  justify-content: center;
  align-items: center;
}


/* ================================
   CONTENEDOR
================================ */

#chat-container {
  width: 95%;
  max-width: 520px;
  height: 92vh;

  background: rgba(255,255,255,0.92);

  display: flex;
  flex-direction: column;

  border-radius: 28px;

  overflow: hidden;

  box-shadow:
    0 25px 60px rgba(15,23,42,0.15),
    0 5px 15px rgba(30,64,175,0.08);

  backdrop-filter: blur(15px);

  border: 1px solid rgba(255,255,255,0.7);
}


/* ================================
   CABECERA
================================ */

#chat-header {

  background:
    linear-gradient(
      135deg,
      #172554,
      #1e3a8a,
      #2563eb
    );

  color: white;

  padding: 18px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  position: relative;

  box-shadow: 0 5px 20px rgba(30,58,138,0.25);
}


.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}


.bot-icon {

  width: 48px;
  height: 48px;

  border-radius: 15px;

  background: rgba(255,255,255,0.15);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.15),
    0 5px 15px rgba(0,0,0,0.12);
}


.header-title {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.2px;
}


.header-subtitle {

  font-size: 0.72rem;

  opacity: 0.85;

  margin-top: 3px;

  display: flex;
  align-items: center;

  gap: 5px;
}


.status-dot {

  width: 7px;
  height: 7px;

  background: #4ade80;

  border-radius: 50%;

  box-shadow: 0 0 8px #4ade80;
}


.version-badge {

  position: absolute;

  top: 9px;
  right: 12px;

  font-size: 0.62rem;

  padding: 4px 7px;

  border-radius: 10px;

  background: rgba(255,255,255,0.12);

  color: #dbeafe;
}


/* ================================
   ÁREA DE MENSAJES
================================ */

#chat-messages {

  flex: 1;

  padding: 22px 18px;

  overflow-y: auto;

  display: flex;

  flex-direction: column;

  gap: 13px;

  scroll-behavior: smooth;

  background:
    linear-gradient(
      rgba(239,246,255,0.88),
      rgba(248,250,252,0.95)
    );
}


/* Scroll */

#chat-messages::-webkit-scrollbar {
  width: 6px;
}

#chat-messages::-webkit-scrollbar-track {
  background: transparent;
}

#chat-messages::-webkit-scrollbar-thumb {

  background: #bfdbfe;

  border-radius: 20px;
}


/* ================================
   MENSAJES
================================ */

.message {

  max-width: 84%;

  padding: 13px 16px;

  border-radius: 18px;

  font-size: 0.93rem;

  line-height: 1.55;

  word-wrap: break-word;

  opacity: 0;

  transform: translateY(12px) scale(0.98);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;

  animation: none;
}


.message.show {

  opacity: 1;

  transform: translateY(0) scale(1);
}


/* Bot */

.bot {

  align-self: flex-start;

  background: white;

  color: #1e293b;

  border-bottom-left-radius: 5px;

  border: 1px solid #e5e7eb;

  box-shadow:
    0 5px 18px rgba(15,23,42,0.06);
}


/* Usuario */

.user {

  align-self: flex-end;

  color: white;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1e40af
    );

  border-bottom-right-radius: 5px;

  box-shadow:
    0 6px 18px rgba(37,99,235,0.22);
}


/* ================================
   MENSAJE DE BIENVENIDA
================================ */

.welcome-card {

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #ffffff
    );

  border: 1px solid #dbeafe;

  border-radius: 18px;

  padding: 15px;

  margin-bottom: 4px;
}


.welcome-title {

  font-weight: 700;

  color: #1e3a8a;

  font-size: 1rem;

  margin-bottom: 5px;
}


.welcome-text {

  color: #475569;

  font-size: 0.88rem;
}


/* ================================
   OPCIONES
================================ */

.options {

  display: flex;

  flex-direction: column;

  gap: 9px;

  margin-top: 5px;

  width: 100%;
}


.chip {

  width: 100%;

  border: 1px solid #dbeafe;

  background: white;

  color: #1e3a8a;

  padding: 12px 14px;

  border-radius: 14px;

  cursor: pointer;

  font-size: 0.88rem;

  font-weight: 600;

  text-align: left;

  display: flex;

  align-items: center;

  gap: 10px;

  transition:
    transform 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease,
    border 0.2s ease;

  box-shadow:
    0 3px 10px rgba(15,23,42,0.04);
}


.chip:hover {

  transform: translateY(-2px);

  background: #eff6ff;

  border-color: #93c5fd;

  box-shadow:
    0 7px 18px rgba(37,99,235,0.12);
}


.chip:active {

  transform: scale(0.98);
}


/* ================================
   ICONOS DE BOTONES
================================ */

.option-icon {

  width: 34px;
  height: 34px;

  flex-shrink: 0;

  border-radius: 10px;

  background: #eff6ff;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 17px;
}


/* ================================
   BOTÓN REINICIAR
================================ */

.restart-container {

  padding: 10px 18px 15px;

  background: rgba(248,250,252,0.95);

  border-top: 1px solid #e5e7eb;

}


.restart-button {

  width: 100%;

  border: none;

  background: transparent;

  color: #64748b;

  padding: 8px;

  border-radius: 10px;

  cursor: pointer;

  font-size: 0.78rem;

  transition: 0.2s ease;
}


.restart-button:hover {

  background: #f1f5f9;

  color: #1e3a8a;
}


/* ================================
   INDICADOR DE ESCRITURA
================================ */

.typing {

  align-self: flex-start;

  background: white;

  border: 1px solid #e5e7eb;

  border-radius: 16px;

  padding: 10px 14px;

  display: flex;

  align-items: center;

  gap: 5px;

  box-shadow:
    0 4px 12px rgba(15,23,42,0.05);
}


.dot {

  width: 6px;
  height: 6px;

  background: #3b82f6;

  border-radius: 50%;

  animation: typing 1.2s infinite;
}


.dot:nth-child(2) {
  animation-delay: 0.2s;
}


.dot:nth-child(3) {
  animation-delay: 0.4s;
}


@keyframes typing {

  0%, 60%, 100% {
    transform: translateY(0);
    opacity: 0.35;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }

}


/* ================================
   ENLACES
================================ */

a {

  color: #2563eb;

  text-decoration: none;

  font-weight: 700;
}


a:hover {
  text-decoration: underline;
}


/* ================================
   RESALTADOS
================================ */

.highlight {

  color: #1d4ed8;

  font-weight: 700;
}


/* ================================
   ETIQUETAS DE RESPUESTA
================================ */

.info-label {

  display: inline-block;

  font-size: 0.7rem;

  font-weight: 700;

  color: #2563eb;

  background: #eff6ff;

  padding: 4px 8px;

  border-radius: 7px;

  margin-bottom: 7px;
}


/* ================================
   RESPONSIVE
================================ */

@media (max-width: 480px) {

  body {
    align-items: stretch;
  }

  #chat-container {

    width: 100%;

    height: 100vh;

    max-width: none;

    border-radius: 0;

  }

  #chat-header {
    padding: 15px;
  }

  #chat-messages {
    padding: 18px 13px;
  }

  .message {
    max-width: 90%;
    font-size: 0.9rem;
  }

  .chip {
    font-size: 0.86rem;
  }

}


/* ================================
   ANIMACIÓN DEL HEADER
================================ */

#chat-header::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #60a5fa,
      transparent
    );

  animation: shine 3s infinite;
}


@keyframes shine {

  0% {
    opacity: 0.2;
  }

  50% {
    opacity: 1;
  }

  100% {
    opacity: 0.2;
  }

}

</style>
</head>


<body>


<div id="chat-container">


  <!-- ============================
       HEADER
  ============================= -->

  <div id="chat-header">

    <div class="header-left">

      <div class="bot-icon">
        🤖
      </div>

      <div>

        <div class="header-title">
          Asistente Virtual UTAN
        </div>

        <div class="header-subtitle">

          <span class="status-dot"></span>

          Sistemas • En línea

        </div>

      </div>

    </div>

    <div class="version-badge">
      v2.0
    </div>

  </div>


  <!-- ============================
       CHAT
  ============================= -->

  <div id="chat-messages"></div>


  <!-- ============================
       REINICIAR
  ============================= -->

  <div class="restart-container">

    <button
      class="restart-button"
      onclick="restartChat()"
    >
      🔄 Reiniciar conversación
    </button>

  </div>


</div>


<script>


/* ==================================
   INFORMACIÓN DE SISTEMAS
================================== */

const menu = {

  sistemas: {

    question:
      "¿Qué problema necesitas resolver? Selecciona una opción y te proporcionaré los pasos correspondientes.",

    options: [

      {

        text: "No puedo entrar a Mi Red Aliat",

        icon: "📱",

        answer: `
          <span class="info-label">MI RED ALIAT</span><br>

          Si no puedes ingresar a Mi Red Aliat, realiza las siguientes comprobaciones:

          <br><br>

          <strong>1.</strong> Verifica que solo tengas una aplicación instalada.<br>
          <strong>2.</strong> Si tienes dos aplicaciones, desinstálalas y conserva únicamente la más reciente.<br>
          <strong>3.</strong> Puedes verificarlo desde <strong>Ajustes → Aplicaciones</strong>.<br>
          <strong>4.</strong> Comprueba que no tengas algún adeudo pendiente.

          <br><br>

          💡 <strong>Recomendación:</strong> después de realizar los cambios, reinicia tu dispositivo e intenta ingresar nuevamente.
        `

      },


      {

        text: "Problemas con Brightspace",

        icon: "📚",

        answer: `
          <span class="info-label">BRIGHTSPACE</span><br>

          Si Brightspace presenta errores, no carga correctamente o no aparecen tus tareas mientras que a tus compañeros sí, solicita apoyo al área correspondiente.

          <br><br>

          📧 <strong>Correo:</strong><br>

          <a href="mailto:ayudaenlinea@redaliat.mx">
            ayudaenlinea@redaliat.mx
          </a>

          <br><br>

          📱 <strong>WhatsApp:</strong><br>

          <a
            href="https://wa.me/525578881566?text=Hola%2C%20tengo%20un%20problema%20con%20Brightspace"
            target="_blank"
          >
            55 7888 1566
          </a>

          <br><br>

          Para agilizar la atención, incluye:

          <br><br>

          • Nombre completo<br>
          • ID (E+00000+)<br>
          • Licenciatura<br>
          • Campus

          <br><br>

          💡 <strong>Tip:</strong> si el problema ocurre únicamente en tu cuenta, menciona exactamente qué actividad o materia presenta el error.
        `

      },


      {

        text: "Olvidé mi contraseña de Brightspace o correo",

        icon: "🔑",

        answer: `
          <span class="info-label">RECUPERACIÓN DE CONTRASEÑA</span><br>

          Si olvidaste tu contraseña de Brightspace o de tu correo institucional, solicita asistencia mediante los siguientes medios:

          <br><br>

          📧 <strong>Correo:</strong><br>

          <a href="mailto:ayudaenlinea@redaliat.mx">
            ayudaenlinea@redaliat.mx
          </a>

          <br><br>

          📱 <strong>WhatsApp:</strong><br>

          <a
            href="https://wa.me/525578881566?text=Hola%2C%20olvid%C3%A9%20mi%20contrase%C3%B1a"
            target="_blank"
          >
            55 7888 1566
          </a>

          <br><br>

          Incluye la siguiente información:

          <br><br>

          • Nombre completo<br>
          • ID<br>
          • Carrera<br>
          • Campus

          <br><br>

          🔐 <strong>Importante:</strong> no compartas tu contraseña actual ni datos sensibles en el mensaje.
        `

      },


      {

        text: "Licencia de Office",

        icon: "💻",

        answer: `
          <span class="info-label">OFFICE 365</span><br>

          Tu cuenta institucional incluye acceso a <strong>Office 365 en línea</strong>.

          <br><br>

          🌐 Puedes utilizar las aplicaciones directamente desde el navegador.

          <br><br>

          ⚠️ <strong>Importante:</strong>

          <br><br>

          No instales la versión local de Office con esta cuenta, ya que después de aproximadamente <strong>3 meses</strong> puede marcarse como inactiva.

          <br><br>

          💡 <strong>Recomendación:</strong> utiliza la versión en línea para evitar problemas de activación.
        `

      }

    ]

  }

};


/* ==================================
   ELEMENTOS
================================== */

const chat = document.getElementById("chat-messages");


/* ==================================
   AGREGAR MENSAJE
================================== */

function addMessage(text, sender = "bot") {

  const div = document.createElement("div");

  div.classList.add("message", sender);

  div.innerHTML = text;

  chat.appendChild(div);

  setTimeout(() => {

    div.classList.add("show");

    chat.scrollTop = chat.scrollHeight;

  }, 30);

}


/* ==================================
   OPCIONES
================================== */

function showOptions(options) {

  const optDiv = document.createElement("div");

  optDiv.classList.add("options");


  options.forEach(opt => {

    const btn = document.createElement("button");

    btn.classList.add("chip");

    btn.innerHTML = `
      <span class="option-icon">
        ${opt.icon}
      </span>

      <span>
        ${opt.text}
      </span>
    `;


    btn.onclick = () => {

      handleOption(opt);

    };


    optDiv.appendChild(btn);

  });


  chat.appendChild(optDiv);

  chat.scrollTop = chat.scrollHeight;

}


/* ==================================
   EFECTO ESCRIBIENDO
================================== */

function typingEffect(callback, text = "") {

  const typingDiv = document.createElement("div");

  typingDiv.classList.add("typing");

  typingDiv.innerHTML = `
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  `;


  chat.appendChild(typingDiv);

  chat.scrollTop = chat.scrollHeight;


  const delay = Math.min(

    Math.max(text.length * 10, 500),

    1400

  );


  setTimeout(() => {

    if (typingDiv.parentNode) {

      typingDiv.remove();

    }

    callback();

  }, delay);

}


/* ==================================
   MOSTRAR SISTEMAS
================================== */

function renderSystems() {

  const section = menu.sistemas;


  typingEffect(() => {

    addMessage(

      section.question,

      "bot"

    );


    showOptions(

      section.options

    );

  }, section.question);

}


/* ==================================
   MANEJAR OPCIÓN
================================== */

function handleOption(opt) {

  addMessage(

    opt.text,

    "user"

  );


  typingEffect(() => {

    addMessage(

      opt.answer,

      "bot"

    );


    setTimeout(() => {

      addMessage(

        "¿Necesitas consultar otro tema de Sistemas? 👇",

        "bot"

      );


      showOptions(

        menu.sistemas.options

      );

    }, 250);

  }, opt.answer);

}


/* ==================================
   BIENVENIDA
================================== */

function showWelcome() {

  addMessage(`

    <div class="welcome-card">

      <div class="welcome-title">
        👋 ¡Hola! Bienvenido
      </div>

      <div class="welcome-text">
        Soy el asistente virtual del área de
        <strong>Sistemas de UTAN Industrias</strong>.
        <br><br>
        Estoy aquí para ayudarte a resolver
        problemas frecuentes de acceso,
        Brightspace, contraseñas y Office 365.
      </div>

    </div>

  `, "bot");

}


/* ==================================
   REINICIAR
================================== */

function restartChat() {

  chat.innerHTML = "";

  showWelcome();

  setTimeout(() => {

    renderSystems();

  }, 400);

}


/* ==================================
   INICIO
================================== */

showWelcome();


setTimeout(() => {

  renderSystems();

}, 500);


</script>

</body>
</html>
