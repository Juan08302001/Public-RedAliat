<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistente Virtual UTAN - Sistemas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Inter", "Segoe UI", Arial, sans-serif;

  background:
    radial-gradient(circle at 10% 10%, #dbeafe, transparent 30%),
    radial-gradient(circle at 90% 90%, #bfdbfe, transparent 30%),
    #f1f5f9;

  display: flex;
  justify-content: center;
  align-items: center;
}


/* ================================
   CONTENEDOR
================================ */

#chat-container {
  width: 95%;
  max-width: 540px;
  height: 92vh;

  display: flex;
  flex-direction: column;

  background: #f8fafc;

  border-radius: 28px;

  overflow: hidden;

  box-shadow:
    0 25px 70px rgba(15, 23, 42, .16),
    0 5px 20px rgba(37, 99, 235, .08);
}


/* ================================
   HEADER
================================ */

#chat-header {
  position: relative;

  padding: 18px 20px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #172554,
      #1e3a8a,
      #2563eb
    );

  display: flex;
  align-items: center;
  justify-content: space-between;
}


.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}


.bot-icon {
  width: 48px;
  height: 48px;

  border-radius: 15px;

  background: rgba(255,255,255,.15);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
}


.header-title {
  font-size: 1.05rem;
  font-weight: 700;
}


.header-subtitle {
  margin-top: 4px;

  font-size: .72rem;

  color: #dbeafe;

  display: flex;
  align-items: center;
  gap: 5px;
}


.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #4ade80;

  box-shadow: 0 0 8px #4ade80;
}


.version {
  position: absolute;

  right: 12px;
  top: 8px;

  font-size: .6rem;

  color: #dbeafe;
}


/* ================================
   CHAT
================================ */

#chat-messages {
  flex: 1;

  overflow-y: auto;

  padding: 20px 17px;

  display: flex;
  flex-direction: column;

  gap: 12px;

  scroll-behavior: smooth;

  background:
    linear-gradient(
      180deg,
      #eff6ff,
      #f8fafc
    );
}


#chat-messages::-webkit-scrollbar {
  width: 5px;
}

#chat-messages::-webkit-scrollbar-thumb {
  background: #bfdbfe;
  border-radius: 20px;
}


/* ================================
   MENSAJES
================================ */

.message {
  max-width: 88%;

  padding: 13px 15px;

  border-radius: 18px;

  font-size: .9rem;

  line-height: 1.55;

  opacity: 0;

  transform: translateY(10px);

  transition: .3s ease;
}


.message.show {
  opacity: 1;
  transform: translateY(0);
}


.bot {
  align-self: flex-start;

  background: white;

  color: #1e293b;

  border: 1px solid #e2e8f0;

  border-bottom-left-radius: 5px;

  box-shadow:
    0 5px 18px rgba(15,23,42,.05);
}


.user {
  align-self: flex-end;

  color: white;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1e40af
    );

  border-bottom-right-radius: 5px;

  box-shadow:
    0 5px 16px rgba(37,99,235,.2);
}


/* ================================
   BIENVENIDA
================================ */

.welcome {
  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #ffffff
    );

  border: 1px solid #dbeafe;

  border-radius: 17px;

  padding: 15px;
}


.welcome-title {
  color: #1e3a8a;

  font-size: 1rem;

  font-weight: 700;

  margin-bottom: 6px;
}


.welcome-text {
  color: #475569;

  font-size: .86rem;
}


/* ================================
   OPCIONES
================================ */

.options {
  display: flex;

  flex-direction: column;

  gap: 9px;

  width: 100%;

  margin-top: 4px;
}


.chip {

  width: 100%;

  border: 1px solid #dbeafe;

  background: white;

  color: #1e3a8a;

  border-radius: 15px;

  padding: 11px 12px;

  cursor: pointer;

  text-align: left;

  display: flex;

  align-items: center;

  gap: 11px;

  font-size: .86rem;

  font-weight: 600;

  transition: .2s ease;

  box-shadow:
    0 3px 10px rgba(15,23,42,.04);
}


.chip:hover {

  transform: translateY(-2px);

  background: #eff6ff;

  border-color: #93c5fd;

  box-shadow:
    0 7px 18px rgba(37,99,235,.12);
}


.chip:active {
  transform: scale(.98);
}


.icon {

  min-width: 35px;
  height: 35px;

  border-radius: 10px;

  background: #eff6ff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 17px;
}


/* ================================
   TARJETAS DE AVISO
================================ */

.alert {

  padding: 12px;

  border-radius: 13px;

  margin-top: 8px;

  font-size: .83rem;
}


.alert-warning {

  background: #fff7ed;

  border: 1px solid #fed7aa;

  color: #9a3412;
}


.alert-danger {

  background: #fef2f2;

  border: 1px solid #fecaca;

  color: #991b1b;
}


.alert-success {

  background: #f0fdf4;

  border: 1px solid #bbf7d0;

  color: #166534;
}


.step {

  background: #f8fafc;

  border: 1px solid #e2e8f0;

  padding: 9px 11px;

  margin: 7px 0;

  border-radius: 10px;

  font-size: .84rem;
}


/* ================================
   LABEL
================================ */

.label {

  display: inline-block;

  padding: 4px 8px;

  border-radius: 7px;

  background: #eff6ff;

  color: #2563eb;

  font-size: .68rem;

  font-weight: 700;

  margin-bottom: 6px;
}


/* ================================
   ENLACES
================================ */

a {

  color: #2563eb;

  font-weight: 700;

  text-decoration: none;
}


a:hover {
  text-decoration: underline;
}


/* ================================
   TYPING
================================ */

.typing {

  display: flex;

  gap: 5px;

  align-items: center;

  padding: 10px 13px;

  background: white;

  border: 1px solid #e2e8f0;

  border-radius: 15px;

  align-self: flex-start;
}


.dot {

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #3b82f6;

  animation: typing 1.2s infinite;
}


.dot:nth-child(2) {
  animation-delay: .2s;
}


.dot:nth-child(3) {
  animation-delay: .4s;
}


@keyframes typing {

  0%,60%,100% {
    transform: translateY(0);
    opacity: .35;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }

}


/* ================================
   FOOTER
================================ */

.footer {

  padding: 10px 16px 14px;

  border-top: 1px solid #e2e8f0;

  background: #fff;
}


.restart {

  width: 100%;

  border: none;

  background: #f8fafc;

  color: #64748b;

  padding: 8px;

  border-radius: 10px;

  cursor: pointer;

  font-size: .77rem;

  transition: .2s;
}


.restart:hover {

  background: #eff6ff;

  color: #1e3a8a;
}


/* ================================
   MÓVIL
================================ */

@media(max-width:480px) {

  body {
    align-items: stretch;
  }

  #chat-container {

    width: 100%;

    height: 100vh;

    border-radius: 0;
  }

  #chat-messages {
    padding: 17px 12px;
  }

  .message {
    max-width: 92%;
    font-size: .88rem;
  }

}

</style>
</head>


<body>


<div id="chat-container">


<!-- HEADER -->

<div id="chat-header">

  <div class="header-left">

    <div class="bot-icon">
      🤖
    </div>

    <div>

      <div class="header-title">
        Asistente Virtual UTAN
      </div>

      <div class="header-subtitle">

        <span class="status-dot"></span>

        Sistemas · En línea

      </div>

    </div>

  </div>

  <div class="version">
    v3.0
  </div>

</div>


<!-- CHAT -->

<div id="chat-messages"></div>


<!-- FOOTER -->

<div class="footer">

  <button
    class="restart"
    onclick="restartChat()"
  >
    🔄 Volver al inicio
  </button>

</div>


</div>


<script>


/* ==========================================
   DATOS DEL ASISTENTE
========================================== */

const menu = {

  inicio: {

    question:
      "¿Qué necesitas resolver? Elige una opción para comenzar.",

    options: [

      {
        text: "📱 No puedo entrar a Mi Red Aliat",
        icon: "📱",
        next: "redaliat"
      },

      {
        text: "📚 Tengo problemas con Brightspace",
        icon: "📚",
        next: "brightspace"
      },

      {
        text: "🔑 Olvidé mi contraseña",
        icon: "🔑",
        next: "password"
      },

      {
        text: "📧 Problemas al entrar a mi correo",
        icon: "📧",
        next: "correo"
      },

      {
        text: "💻 Tengo dudas sobre Office",
        icon: "💻",
        next: "office"
      },

      {
        text: "🛡️ Recibí un correo sospechoso",
        icon: "🛡️",
        next: "seguridad"
      }

    ]

  },


  /* ==============================
     MI RED ALIAT
  ============================== */

  redaliat: {

    question:
      "Vamos a revisar tu acceso a Mi Red Aliat paso a paso.",

    answer: `

      <span class="label">MI RED ALIAT</span>

      <div class="step">
        <strong>1.</strong> Revisa que tengas instalada únicamente la aplicación más reciente.
      </div>

      <div class="step">
        <strong>2.</strong> Si aparecen dos aplicaciones relacionadas, desinstala la versión anterior.
      </div>

      <div class="step">
        <strong>3.</strong> Puedes comprobarlo desde:
        <strong>Ajustes → Aplicaciones</strong>.
      </div>

      <div class="step">
        <strong>4.</strong> Verifica que no tengas algún adeudo pendiente.
      </div>

      <div class="alert alert-success">
        💡 Después de realizar estos pasos, intenta iniciar sesión nuevamente.
      </div>

    `

  },


  /* ==============================
     BRIGHTSPACE
  ============================== */

  brightspace: {

    question:
      "Si Brightspace no funciona correctamente, sigue estas indicaciones.",

    answer: `

      <span class="label">BRIGHTSPACE</span>

      <div class="step">
        <strong>1.</strong> Comprueba que tengas conexión a Internet.
      </div>

      <div class="step">
        <strong>2.</strong> Cierra sesión y vuelve a iniciar sesión.
      </div>

      <div class="step">
        <strong>3.</strong> Si no aparecen tareas que tus compañeros sí pueden ver, solicita apoyo.
      </div>

      <br>

      📧 <strong>Correo:</strong><br>

      <a href="mailto:ayudaenlinea@redaliat.mx">
        ayudaenlinea@redaliat.mx
      </a>

      <br><br>

      📱 <strong>WhatsApp:</strong><br>

      <a
        href="https://wa.me/525578881566?text=Hola%2C%20tengo%20un%20problema%20con%20Brightspace"
        target="_blank"
      >
        55 7888 1566
      </a>

      <div class="alert alert-success">

        📌 Para recibir ayuda más rápido incluye:

        <br><br>

        • Nombre completo<br>
        • ID (E+00000+)<br>
        • Licenciatura<br>
        • Campus<br>
        • Captura del problema, si es posible

      </div>

    `

  },


  /* ==============================
     CONTRASEÑA
  ============================== */

  password: {

    question:
      "¿Olvidaste tu contraseña? Estos son los medios para solicitar ayuda.",

    answer: `

      <span class="label">RECUPERAR ACCESO</span>

      Si olvidaste la contraseña de Brightspace o de tu correo institucional:

      <div class="step">
        📧 Escribe a:
        <br>
        <a href="mailto:ayudaenlinea@redaliat.mx">
          ayudaenlinea@redaliat.mx
        </a>
      </div>

      <div class="step">
        📱 También puedes comunicarte por WhatsApp:
        <br>
        <a
          href="https://wa.me/525578881566?text=Hola%2C%20olvid%C3%A9%20mi%20contrase%C3%B1a"
          target="_blank"
        >
          55 7888 1566
        </a>
      </div>

      <div class="alert alert-warning">

        🔐 Nunca envíes tu contraseña actual por correo o WhatsApp.

      </div>

      Incluye:

      <br><br>

      • Nombre completo<br>
      • ID<br>
      • Carrera<br>
      • Campus

    `

  },


  /* ==============================
     CORREO + AUTHENTICATOR
  ============================== */

  correo: {

    question:
      "¿Te aparece Microsoft Authenticator al intentar entrar a tu correo?",

    answer: `

      <span class="label">ACCESO AL CORREO</span>

      En ocasiones, al iniciar sesión en el correo institucional puede solicitarse una verificación mediante Microsoft Authenticator.

      <br><br>

      Si necesitas utilizar otro método de verificación y la pantalla te muestra la opción:

      <div class="step">
        <strong>1.</strong> Selecciona
        <strong>“Usar otra cuenta”</strong>
        o la opción equivalente que aparezca en pantalla.
      </div>

      <div class="step">
        <strong>2.</strong> Revisa si Microsoft ofrece
        <strong>otro método de verificación</strong>.
      </div>

      <div class="step">
        <strong>3.</strong> Selecciona únicamente un método que tengas autorizado y puedas utilizar.
      </div>

      <div class="step">
        <strong>4.</strong> Continúa siguiendo las instrucciones que aparezcan en pantalla.
      </div>

      <div class="alert alert-warning">

        ⚠️ Las opciones disponibles pueden variar según la configuración de tu cuenta. Si no aparece otro método, no intentes repetidamente opciones al azar.

      </div>

      <div class="alert alert-success">

        💡 Si sigues sin poder acceder, solicita apoyo al área de Sistemas para revisar el método de autenticación de tu cuenta.

      </div>

    `

  },


  /* ==============================
     OFFICE
  ============================== */

  office: {

    question:
      "¿Tienes dudas sobre la licencia de Office?",

    answer: `

      <span class="label">OFFICE 365</span>

      Tu cuenta institucional incluye acceso a Office 365 en línea.

      <div class="step">
        🌐 Puedes utilizar Word, Excel, PowerPoint y otras herramientas desde el navegador, según las aplicaciones disponibles para tu cuenta.
      </div>

      <div class="alert alert-warning">

        ⚠️ Evita instalar versiones no autorizadas o utilizar activadores.

      </div>

      <div class="alert alert-success">

        💡 Si tienes problemas con tu cuenta, utiliza los medios oficiales de soporte.

      </div>

    `

  },


  /* ==============================
     SEGURIDAD
  ============================== */

  seguridad: {

    question:
      "🚨 Si recibiste un correo diciendo que tu cuenta será desactivada, primero revisa esto.",

    answer: `

      <span class="label">SEGURIDAD</span>

      Los mensajes que amenazan con cerrar, suspender o desactivar una cuenta y te piden iniciar sesión mediante un enlace deben tratarse como <strong>sospechosos</strong>.

      <div class="alert alert-danger">

        🚨 <strong>NO HAGAS CLIC EN EL ENLACE</strong> si no estás seguro de que el mensaje sea legítimo.

      </div>

      <div class="step">
        <strong>1.</strong> No abras enlaces ni archivos adjuntos sospechosos.
      </div>

      <div class="step">
        <strong>2.</strong> No introduzcas tu contraseña en una página a la que llegaste desde ese correo.
      </div>

      <div class="step">
        <strong>3.</strong> Comprueba la dirección real del remitente.
      </div>

      <div class="step">
        <strong>4.</strong> Si tienes dudas, consulta directamente con Sistemas.
      </div>

      <div class="alert alert-warning">

        🔐 <strong>Regla sencilla:</strong><br>
        Si un correo te asusta, te mete prisa y te pide iniciar sesión desde un enlace, detente y verifica primero.

      </div>

      <div class="alert alert-success">

        ✅ Es más seguro entrar al servicio escribiendo tú mismo la dirección oficial en el navegador que utilizando un enlace sospechoso del correo.

      </div>

    `

  }

};


/* ==========================================
   ELEMENTOS
========================================== */

const chat = document.getElementById("chat-messages");


/* ==========================================
   MENSAJE
========================================== */

function addMessage(text, sender = "bot") {

  const div = document.createElement("div");

  div.classList.add("message", sender);

  div.innerHTML = text;

  chat.appendChild(div);

  setTimeout(() => {

    div.classList.add("show");

    chat.scrollTop = chat.scrollHeight;

  }, 30);

}


/* ==========================================
   OPCIONES
========================================== */

function showOptions(options) {

  const container = document.createElement("div");

  container.classList.add("options");


  options.forEach(option => {

    const button = document.createElement("button");

    button.classList.add("chip");


    button.innerHTML = `

      <span class="icon">
        ${option.icon}
      </span>

      <span>
        ${option.text}
      </span>

    `;


    button.onclick = () => {

      handleOption(option);

    };


    container.appendChild(button);

  });


  chat.appendChild(container);

  chat.scrollTop = chat.scrollHeight;

}


/* ==========================================
   ESCRIBIENDO
========================================== */

function typingEffect(callback) {

  const typing = document.createElement("div");

  typing.classList.add("typing");

  typing.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;


  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;


  setTimeout(() => {

    typing.remove();

    callback();

  }, 650);

}


/* ==========================================
   MOSTRAR SECCIÓN
========================================== */

function showSection(key) {

  const section = menu[key];


  if (!section) return;


  typingEffect(() => {

    addMessage(

      section.question,

      "bot"

    );


    if (section.options) {

      showOptions(section.options);

    }


    if (section.answer) {

      setTimeout(() => {

        addMessage(

          section.answer,

          "bot"

        );


        showNavigation();

      }, 200);

    }

  });

}


/* ==========================================
   NAVEGACIÓN
========================================== */

function showNavigation() {

  const navigation = [

    {
      text: "⬅️ Ver temas de Sistemas",
      icon: "↩️",
      next: "inicio"
    }

  ];


  showOptions(navigation);

}


/* ==========================================
   MANEJAR OPCIÓN
========================================== */

function handleOption(option) {

  addMessage(

    option.text,

    "user"

  );


  if (option.next) {

    setTimeout(() => {

      showSection(option.next);

    }, 250);

  }

}


/* ==========================================
   BIENVENIDA
========================================== */

function welcome() {

  addMessage(`

    <div class="welcome">

      <div class="welcome-title">
        👋 ¡Hola! Soy tu asistente de Sistemas
      </div>

      <div class="welcome-text">

        Estoy aquí para ayudarte con problemas
        frecuentes de acceso, correo, Brightspace,
        contraseñas, Office y seguridad.

        <br><br>

        <strong>No necesitas escribir una pregunta.</strong>
        Solo selecciona la opción que más se parezca
        a tu problema.

      </div>

    </div>

  `, "bot");


  setTimeout(() => {

    showSection("inicio");

  }, 450);

}


/* ==========================================
   REINICIAR
========================================== */

function restartChat() {

  chat.innerHTML = "";

  welcome();

}


/* ==========================================
   INICIO
========================================== */

welcome();

</script>

</body>
</html>
